<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text Finder App</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light py-5">
    <div class="container">
      <!-- Card wrapper -->
      <div class="card shadow-sm border-0 mx-auto" style="max-width: 600px">
        <div class="card-header bg-primary text-white">
          <h5 class="mb-0">Text Finder App</h5>
        </div>

        <div class="card-body">
          <!-- Upload form -->
          <form id="upload-form" class="mb-4">
            <div class="mb-3">
              <label for="files" class="form-label fw-semibold"
                >Choose file(s)</label
              >
              <input
                class="form-control"
                type="file"
                id="files"
                name="file"
                multiple
                accept=".txt,.docx,.xlsx,.pdf,.csv,.png,.jpg,.jpeg,.wav,.mp4"
              />
            </div>

            <button type="submit" class="btn btn-primary w-100">
              <i class="bi bi-upload me-1"></i> Upload
            </button>
          </form>

          <!-- Status messages -->
          <div id="upload-status"></div>

          <!-- Search button -->
          <div class="text-center mb-3">
            <button id="search-btn" class="btn btn-success">
              <i class="bi bi-search me-1"></i> Search Words
            </button>
          </div>

          <!-- Files table -->
          <div class="table-responsive">
            <table class="table table-bordered align-middle mb-0">
              <thead class="table-secondary">
                <tr>
                  <th style="width: 10%">#</th>
                  <th>File Name</th>
                  <th style="width: 20%">Actions</th>
                </tr>
              </thead>
              <tbody id="files-table-body">
                <tr>
                  <td colspan="3" class="text-center">Loading files...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap 5 bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    
    <!-- Import modular components -->
    <script src="src/renderer/apiClient.js"></script>
    <script src="src/renderer/fileManager.js"></script>

    <script>
      $(document).ready(function () {
        // Initialize API client
        const apiClient = new APIClient();
        
        // Initialize file manager
        const fileManager = new FileManager(apiClient);
        fileManager.init();
      });
    </script>
  </body>
</html>
