<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text Finder App</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light py-5">
    <div class="container">
      <!-- Card wrapper -->
      <div class="card shadow-sm border-0 mx-auto" style="max-width: 600px">
        <div class="card-header bg-primary text-white">
          <h5 class="mb-0">Text Finder App</h5>
        </div>

        <div class="card-body">
          <!-- Upload form -->
          <form
            action="#"
            method="post"
            enctype="multipart/form-data"
            class="mb-4"
          >
            <div class="mb-3">
              <label for="files" class="form-label fw-semibold"
                >Choose file(s)</label
              >
              <input
                class="form-control"
                type="file"
                id="files"
                name="files"
                multiple
              />
            </div>

            <button type="submit" class="btn btn-primary w-100">
              <i class="bi bi-upload me-1"></i> Upload
            </button>
          </form>

          <!-- Uploaded files table -->
          <div class="table-responsive">
            <table class="table table-bordered align-middle mb-0">
              <thead class="table-secondary">
                <tr>
                  <th style="width: 60px">#</th>
                  <th>Uploaded Files</th>
                  <th style="width: 100px">Actions</th>
                </tr>
              </thead>
              <tbody id="files-table-body">
                <!-- Files will be populated here via JavaScript -->
              </tbody>
            </table>
          </div>
          <div class="mt-3" id="upload-status"></div>
        </div>
      </div>
    </div>

    <!-- Bootstrap 5 JS bundle (optional, for future JS or icons) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Bootstrap Icons (optional) -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
      $(document).ready(function () {
        const API_BASE_URL = "http://127.0.0.1:8000";
        const uploadStatus = $("#upload-status");

        // Load existing files when page loads
        loadUploadedFiles();

        // Handle form submission
        $("form").on("submit", function (e) {
          e.preventDefault();

          const files = $("#files")[0].files;
          if (files.length === 0) {
            showStatus("Please select at least one file to upload", "warning");
            return;
          }

          // Show loading status
          showStatus("Uploading files, please wait...", "info");

          let formData = new FormData();

          // Add all selected files to FormData
          for (let i = 0; i < files.length; i++) {
            formData.append("file", files[i]);
          }

          // Disable submit button during upload
          const submitBtn = $(this).find('button[type="submit"]');
          submitBtn
            .prop("disabled", true)
            .html(
              '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Uploading...'
            );

          $.ajax({
            url: `${API_BASE_URL}/file/`,
            type: "POST",
            data: formData,
            processData: false,
            contentType: false,
            success: function (response) {
              showStatus("Files uploaded successfully!", "success");
              loadUploadedFiles(); // Refresh file list
              // Reset form
              $("form")[0].reset();
            },
            error: function (error) {
              console.error("Upload failed:", error);
              showStatus(
                "Error uploading files. See console for details.",
                "danger"
              );
            },
            complete: function () {
              // Re-enable submit button
              submitBtn
                .prop("disabled", false)
                .html('<i class="bi bi-upload me-1"></i> Upload');
            },
          });
        });

        // Helper function to show status messages
        function showStatus(message, type) {
          uploadStatus.html(`<div class="alert alert-${type} alert-dismissible fade show" role="alert">
            ${message}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>`);

          // Auto-hide success messages after 5 seconds
          if (type === "success") {
            setTimeout(() => {
              uploadStatus.find(".alert").alert("close");
            }, 5000);
          }
        }

        // Function to load uploaded files
        function loadUploadedFiles() {
          $.ajax({
            url: `${API_BASE_URL}/filetbl/`,
            type: "GET",
            dataType: "json",
            success: function (response) {
              if (!response.data || !Array.isArray(response.data)) {
                console.error("Invalid response format:", response);
                showStatus(
                  "Could not load files. Invalid response from server.",
                  "danger"
                );
                return;
              }

              // Process data to get unique files with their IDs
              const fileMap = new Map();

              response.data.forEach((item) => {
                if (item.file) {
                  // Extract just the filename from the path and handle dashes
                  const filePath = item.file;
                  // Get filename without path
                  const fileName = filePath.split("/").pop();

                  // If this file is not yet in our map, add it with its first ID
                  if (!fileMap.has(fileName)) {
                    fileMap.set(fileName, {
                      path: filePath,
                      ids: [item.id],
                    });
                  } else {
                    // If already in map, just add this ID to the list
                    fileMap.get(fileName).ids.push(item.id);
                  }
                }
              });

              // Display files in table
              const tbody = $("#files-table-body");
              tbody.empty();

              if (fileMap.size === 0) {
                tbody.append(
                  `<tr><td colspan="3" class="text-center">No files uploaded yet</td></tr>`
                );
                return;
              }

              let index = 1;
              fileMap.forEach((fileData, fileName) => {
                const shortName =
                  fileName.length > 30
                    ? fileName.substring(0, 27) + "..."
                    : fileName;

                const row = `
                <tr data-filename="${fileName}" data-ids="${fileData.ids.join(
                  ","
                )}">
                  <td>${index}</td>
                  <td title="${fileName}">${shortName}</td>
                  <td>
                    <button class="btn btn-sm btn-danger delete-file">
                      <i class="bi bi-trash"></i> Delete
                    </button>
                  </td>
                </tr>`;
                tbody.append(row);
                index++;
              });

              // Attach event handlers for delete buttons
              attachDeleteHandlers();
            },
            error: function (error) {
              console.error("Failed to load files:", error);
              showStatus(
                "Could not load uploaded files. Check if the backend server is running.",
                "danger"
              );
            },
          });
        }

        // Function to attach delete handlers to file delete buttons
        function attachDeleteHandlers() {
          // Get CSRF token
          function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(";").shift();
          }
          const csrftoken = getCookie("csrftoken");

          // Handle delete button clicks
          $(".delete-file").click(function () {
            const row = $(this).closest("tr");
            const fileName = row.data("filename");
            const ids = String(row.data("ids")).split(",");

            if (
              !confirm(
                `Delete ${fileName}? This will remove all words associated with this file.`
              )
            ) {
              return;
            }

            // Disable the button during deletion
            $(this)
              .prop("disabled", true)
              .html(
                '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>'
              );

            // We need to delete each word entry for this file
            let deletedCount = 0;
            let failedCount = 0;

            // Show deleting status
            showStatus(`Deleting ${fileName}...`, "info");

            // Process each ID for deletion
            ids.forEach((id, index) => {
              $.ajax({
                url: `${API_BASE_URL}/filetbl/${id}`,
                method: "DELETE",
                headers: { "X-CSRFToken": csrftoken },
                success: function () {
                  deletedCount++;
                  if (deletedCount + failedCount === ids.length) {
                    finishDeletion();
                  }
                },
                error: function (xhr, status, err) {
                  console.error(`Delete failed for ID ${id}:`, status, err);
                  failedCount++;
                  if (deletedCount + failedCount === ids.length) {
                    finishDeletion();
                  }
                },
              });
            });

            // Function to handle completion of all delete operations
            function finishDeletion() {
              if (failedCount === 0) {
                row.remove();
                showStatus(`${fileName} deleted successfully.`, "success");

                // Renumber the remaining rows
                $("#files-table-body tr").each((idx, tr) => {
                  $(tr)
                    .find("td:first")
                    .text(idx + 1);
                });

                // If no files left, show message
                if ($("#files-table-body tr").length === 0) {
                  $("#files-table-body").append(
                    `<tr><td colspan="3" class="text-center">No files uploaded yet</td></tr>`
                  );
                }
              } else {
                showStatus(
                  `Some entries failed to delete. Please try again.`,
                  "warning"
                );
                $(this)
                  .prop("disabled", false)
                  .html('<i class="bi bi-trash"></i> Delete');
                loadUploadedFiles(); // Refresh to get an accurate view
              }
            }
          });
        }
      });
    </script>
  </body>
</html>
