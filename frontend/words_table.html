<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search Words</title>

    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
          <!-- Card wrapper -->
          <div class="card shadow-sm border-0">
            <div
              class="card-header bg-primary text-white d-flex justify-content-between align-items-center"
            >
              <h5 class="mb-0">Search Words</h5>
              <button id="upload-btn" class="btn btn-light btn-sm">
                <i class="bi bi-upload"></i> Upload Files
              </button>
            </div>

            <div class="card-body">
              <!-- Search form -->
              <form action="/search/" method="POST" class="mb-4">
                <!-- {% csrf_token %} -->
                <div class="mb-3">
                  <div class="input-group">
                    <input
                      type="text"
                      name="wordsearch"
                      class="form-control"
                      placeholder="Enter word..."
                      required
                    />
                    <button class="btn btn-primary" type="submit">
                      <i class="bi bi-search"></i>
                      Search
                    </button>
                  </div>
                </div>
                <div class="form-check form-check-inline">
                  <input
                    class="form-check-input"
                    type="radio"
                    name="search_type"
                    id="exactMatch"
                    value="exact"
                    checked
                  />
                  <label class="form-check-label" for="exactMatch"
                    >Exact match</label
                  >
                </div>
                <div class="form-check form-check-inline">
                  <input
                    class="form-check-input"
                    type="radio"
                    name="search_type"
                    id="containsMatch"
                    value="contains"
                  />
                  <label class="form-check-label" for="containsMatch"
                    >Contains</label
                  >
                </div>
              </form>

              <!-- Results table -->
              <div id="search-results" class="mt-3">
                <div class="alert alert-info" role="alert">
                  <i class="bi bi-info-circle me-2"></i> Enter a word above to
                  search through all uploaded files
                </div>
              </div>

              <div class="table-responsive d-none" id="results-table-container">
                <table
                  class="table table-striped table-bordered align-middle mb-0"
                >
                  <thead class="table-secondary">
                    <tr>
                      <th style="width: 40%">Word</th>
                      <th style="width: 60%">Found In File</th>
                    </tr>
                  </thead>
                  <tbody id="results-table-body">
                    <!-- Results will appear here after search -->
                  </tbody>
                </table>
              </div>
            </div>
          </div>
          <!-- /card -->
        </div>
      </div>
    </div>

    <!-- Bootstrap 5 bundle + Icons -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    
    <!-- Import modular components -->
    <script src="src/renderer/apiClient.js"></script>
    <script src="src/renderer/searchManager.js"></script>
    
    <script>
      $(document).ready(function () {
        // Initialize API client
        const apiClient = new APIClient();
        
        // Initialize search manager
        const searchManager = new SearchManager(apiClient);
        searchManager.init();
      });
    </script>
  </body>
</html>
