<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text Finder App</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary-color: #3629b7;
        --primary-light: #4a3dd6;
        --background: #ffffff;
        --text-primary: #1f2937;
        --text-secondary: #6b7280;
        --text-muted: #9ca3af;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        overflow: hidden;
        background: linear-gradient(
          135deg,
          #f0efff 0%,
          #ffffff 50%,
          #f9fafb 100%
        );
        color: var(--text-primary);
      }

      .splash-container {
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        position: relative;
      }

      .logo-container {
        text-align: center;
        animation: fadeInUp 0.8s ease-out;
      }

      .app-title {
        font-size: 3rem;
        margin-bottom: 0.5rem;
        background: linear-gradient(
          135deg,
          var(--primary-color),
          var(--primary-light)
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        font-weight: 700;
        letter-spacing: -0.025em;
      }

      .app-subtitle {
        font-size: 1.125rem;
        color: var(--text-secondary);
        margin-bottom: 3rem;
        font-weight: 400;
      }

      .app-logo {
        width: 140px;
        height: 140px;
        background: linear-gradient(
          135deg,
          var(--primary-color),
          var(--primary-light)
        );
        border-radius: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 2rem;
        position: relative;
        overflow: hidden;
        animation: logoFloat 3s ease-in-out infinite;
        box-shadow: 0 20px 40px rgba(54, 41, 183, 0.2);
      }

      .app-logo::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(
          45deg,
          transparent 30%,
          rgba(255, 255, 255, 0.1) 50%,
          transparent 70%
        );
        animation: shine 2s infinite;
      }

      .logo-icon {
        color: white;
        font-size: 4rem;
        z-index: 1;
        position: relative;
      }

      .loading-text {
        color: var(--text-secondary);
        font-size: 1rem;
        margin-bottom: 2rem;
        font-weight: 500;
      }

      .progress-container {
        width: 280px;
        margin-top: 2rem;
      }

      .progress {
        width: 100%;
        height: 6px;
        background: rgba(54, 41, 183, 0.1);
        border-radius: 3px;
        overflow: hidden;
        margin-bottom: 1rem;
      }

      .progress-bar {
        height: 100%;
        background: linear-gradient(
          135deg,
          var(--primary-color),
          var(--primary-light)
        );
        border-radius: 3px;
        transition: width 0.3s ease;
        position: relative;
      }

      .progress-bar::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.3),
          transparent
        );
        animation: progressShine 1.5s infinite;
      }

      .loading-percentage {
        text-align: center;
        font-size: 0.875rem;
        color: var(--text-muted);
        font-weight: 500;
      }

      .splash-footer {
        position: absolute;
        bottom: 30px;
        font-size: 0.875rem;
        color: var(--text-muted);
        font-weight: 400;
      }

      .feature-icons {
        display: flex;
        gap: 2rem;
        margin-top: 2rem;
        opacity: 0.6;
      }

      .feature-icon {
        width: 40px;
        height: 40px;
        background: rgba(54, 41, 183, 0.1);
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--primary-color);
        font-size: 1.25rem;
        animation: bounce 2s infinite;
      }

      .feature-icon:nth-child(2) {
        animation-delay: 0.2s;
      }

      .feature-icon:nth-child(3) {
        animation-delay: 0.4s;
      }

      .feature-icon:nth-child(4) {
        animation-delay: 0.6s;
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes logoFloat {
        0%,
        100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-10px);
        }
      }

      @keyframes shine {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(100%);
        }
      }

      @keyframes progressShine {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(100%);
        }
      }

      @keyframes bounce {
        0%,
        20%,
        50%,
        80%,
        100% {
          transform: translateY(0);
        }
        40% {
          transform: translateY(-10px);
        }
        60% {
          transform: translateY(-5px);
        }
      }

      @media (max-width: 768px) {
        .app-title {
          font-size: 2.5rem;
        }

        .app-logo {
          width: 120px;
          height: 120px;
        }

        .logo-icon {
          font-size: 3rem;
        }

        .progress-container {
          width: 240px;
        }
      }
    </style>
  </head>
  <body>
    <div class="splash-container">
      <div class="logo-container">
        <h1 class="app-title">Text Finder</h1>
        <p class="app-subtitle">Modern Document Search</p>

        <div class="app-logo">
          <i class="bi bi-search logo-icon"></i>
        </div>

        <p class="loading-text">Preparing your experience...</p>

        <div class="progress-container">
          <div class="progress">
            <div
              class="progress-bar"
              role="progressbar"
              aria-valuenow="0"
              aria-valuemin="0"
              aria-valuemax="100"
              style="width: 0%"
            ></div>
          </div>
          <div class="loading-percentage">0%</div>
        </div>

        <div class="feature-icons">
          <div class="feature-icon">
            <i class="bi bi-file-text"></i>
          </div>
          <div class="feature-icon">
            <i class="bi bi-search"></i>
          </div>
          <div class="feature-icon">
            <i class="bi bi-lightning"></i>
          </div>
          <div class="feature-icon">
            <i class="bi bi-shield-check"></i>
          </div>
        </div>
      </div>

      <div class="splash-footer">&copy; 2025 Text Finder Pro</div>
    </div>

    <script>
      // Simulate loading progress with modern animations
      let progress = 0;
      const progressBar = document.querySelector(".progress-bar");
      const progressText = document.querySelector(".loading-percentage");
      const loadingText = document.querySelector(".loading-text");

      const loadingMessages = [
        "Initializing application...",
        "Loading components...",
        "Setting up file handlers...",
        "Preparing search engine...",
        "Almost ready...",
      ];

      const interval = setInterval(() => {
        progress += 4;
        progressBar.style.width = progress + "%";
        progressBar.setAttribute("aria-valuenow", progress);
        progressText.textContent = progress + "%";

        // Update loading message
        const messageIndex = Math.floor(
          (progress / 100) * loadingMessages.length
        );
        if (messageIndex < loadingMessages.length) {
          loadingText.textContent = loadingMessages[messageIndex];
        }

        if (progress >= 100) {
          clearInterval(interval);
          loadingText.textContent = "Ready to launch!";
          // Loading complete - the main process will handle window transition
        }
      }, 80);
    </script>
  </body>
</html>
