<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text Finder App</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        overflow: hidden;
        background-color: #f8f9fa;
      }
      .splash-container {
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }
      .logo-container {
        text-align: center;
      }
      .app-title {
        font-size: 2.5rem;
        margin-bottom: 1rem;
        color: #0d6efd;
        font-weight: 600;
      }
      .app-logo {
        width: 120px;
        height: 120px;
        background-color: #0d6efd;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 2rem;
        position: relative;
        overflow: hidden;
        animation: pulse 2s infinite;
      }
      @keyframes pulse {
        0% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.05);
        }
        100% {
          transform: scale(1);
        }
      }
      .app-logo::before {
        content: "TF";
        color: white;
        font-size: 3rem;
        font-weight: bold;
      }
      .progress {
        width: 200px;
        height: 10px;
        margin-top: 2rem;
      }
      .splash-footer {
        position: absolute;
        bottom: 20px;
        font-size: 0.9rem;
        color: #6c757d;
      }
    </style>
  </head>
  <body>
    <div class="splash-container">
      <div class="logo-container">
        <h1 class="app-title">Text Finder App</h1>
        <div class="app-logo"></div>
        <p class="text-muted">Extracting words from your files</p>
        <div class="progress">
          <div
            class="progress-bar progress-bar-striped progress-bar-animated"
            role="progressbar"
            aria-valuenow="0"
            aria-valuemin="0"
            aria-valuemax="100"
            style="width: 0%"
          ></div>
        </div>
      </div>
      <div class="splash-footer">&copy; 2025 Text Finder App</div>
    </div>

    <script>
      // Simulate loading progress
      let progress = 0;
      const progressBar = document.querySelector(".progress-bar");

      const interval = setInterval(() => {
        progress += 5;
        progressBar.style.width = progress + "%";
        progressBar.setAttribute("aria-valuenow", progress);

        if (progress >= 100) {
          clearInterval(interval);
          // Loading complete - the main process will handle window transition
        }
      }, 100);
    </script>
  </body>
</html>
